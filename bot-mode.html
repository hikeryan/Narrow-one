<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Narrow One - Offline Bot Match</title>
  <style>
    :root {
      --bg: #091522;
      --panel: rgba(15, 23, 42, 0.78);
      --line: rgba(255,255,255,0.15);
      --text: #eef6ff;
      --blue: #4ea1ff;
      --red: #ff5d5d;
      --gold: #ffd166;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    body {
      position: relative;
      background: radial-gradient(circle at top, #112b46 0%, #091522 55%, #050c14 100%);
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, #14263c 0%, #0b1220 100%);
      cursor: crosshair;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .status-panel {
      min-width: 260px;
      text-align: center;
    }

    .legend {
      position: fixed;
      left: 16px;
      bottom: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(15,23,42,0.7);
      border: 1px solid var(--line);
      font-size: 14px;
      z-index: 10;
    }

    .legend strong {
      color: var(--gold);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="panel"><span>Blue: <strong id="blueScore">0</strong></span></div>
    <div class="panel"><span>Red: <strong id="redScore">0</strong></span></div>
    <div class="panel status-panel"><span id="statusText">Offline bot match</span></div>
  </div>

  <div class="legend">
    <div><strong>WASD</strong> move</div>
    <div><strong>Mouse</strong> aim</div>
    <div><strong>Click</strong> shoot</div>
  </div>

  <canvas id="gameCanvas" width="1280" height="720"></canvas>

  <script src="bot-mode.js"></script>
</body>
</html>
